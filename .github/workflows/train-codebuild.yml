name: Train on CodeBuild

# Dispara el entrenamiento en AWS CodeBuild (reemplazo de SageMaker Training).
# Se ejecuta manualmente desde la pestana Actions de GitHub.
on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Credenciales desde GitHub Secrets (nunca hardcodeadas en el repo)
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Lanza el build, espera a que termine y transmite los logs (link en Actions)
      - name: Disparar CodeBuild y esperar
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: churn-training
